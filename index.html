<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Local JSON Formatter</title>

  <!-- JSONEditor CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsoneditor@latest/dist/jsoneditor.min.css" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #e6e6e6;
    }

    header {
      background: #6f8f4e;
      color: white;
      padding: 8px 12px;
      font-size: 16px;
    }

    .container {
      display: flex;
      height: calc(100vh - 40px);
    }

    .pane {
      flex: 1;
      padding: 8px;
      box-sizing: border-box;
    }

    .editor {
      height: 100%;
      border: 1px solid #ccc;
      background: white;
    }

    /* ===== JSONEditor toolbar (top bar) ===== */
    .jsoneditor-menu {
      background-color: #6f8f4e !important;
      /* green */
      border-bottom: 1px solid #5f7f3e !important;
    }

    .jsoneditor-menu button {
      background-color: transparent !important;
      color: #ffffff !important;
    }

    .jsoneditor-menu button:hover {
      background-color: rgba(255, 255, 255, 0.15) !important;
    }

    /* ===== Ace editor header (code mode toolbar) ===== */
    .ace_gutter {
      background: #f4f6f2 !important;
    }

    /* ===== Selection / cursor color ===== */
    .ace_marker-layer .ace_selection {
      background: rgba(111, 143, 78, 0.35) !important;
    }

    .ace_marker-layer .ace_active-line {
      background: rgba(111, 143, 78, 0.15) !important;
    }

    /* ===== Tree mode highlights ===== */
    .jsoneditor-tree .jsoneditor-selected {
      background-color: rgba(111, 143, 78, 0.25) !important;
    }

    /* ===== Search / filter icons ===== */
    .jsoneditor-menu a,
    .jsoneditor-menu a:hover {
      color: #ffffff !important;
    }
  </style>
</head>

<body>

  <header>JSON Editor (Local)</header>

  <div class="container">
    <!-- Left: raw JSON -->
    <div class="pane">
      <div id="editor-left" class="editor"></div>
    </div>

    <!-- Right: formatted JSON -->
    <div class="pane">
      <div id="editor-right" class="editor"></div>
    </div>
  </div>

  <!-- JSONEditor JS -->
  <script src="https://cdn.jsdelivr.net/npm/jsoneditor@latest/dist/jsoneditor.min.js"></script>

  <script>
    const leftContainer = document.getElementById("editor-left");
    const rightContainer = document.getElementById("editor-right");

    const leftEditor = new JSONEditor(leftContainer, {
      mode: "code",
      onChangeText: function (jsonText) {
        try {
          const parsed = JSON.parse(jsonText);
          rightEditor.set(parsed);
        } catch (e) {
          // ignore invalid JSON while typing
        }
      }
    });

    const rightEditor = new JSONEditor(rightContainer, {
      mode: "tree"
    });

    // Optional: starter JSON
    leftEditor.setText(`{
  "hello": "paste JSON here"
}`);
  </script>

</body>

</html>
